<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#14181B" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon-192.png" />
<title>Máster 46</title>
<style>
  :root{
    --bg:#14181B;
    --surface:#1D2226;
    --surface-2:#262B30;
    --line:#333A3F;
    --text:#EDEEEC;
    --text-dim:#9AA1A6;
    --accent:#BF4427;
    --accent-dim:#5A2A1D;
    --rest:#3E7C74;
    --rest-dim:#1E3A36;
    --pair:#6D5FA8;
    --pair-dim:#2A2440;
    --warn:#D9A441;
    --good:#6FA97A;
    --bad:#C0554F;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  #app{
    max-width:480px; margin:0 auto; min-height:100vh;
    display:flex; flex-direction:column; position:relative;
    padding-bottom:76px;
  }
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 18px 10px 18px;
  }
  .topbar h1{ font-size:15px; letter-spacing:.02em; font-weight:700; margin:0; color:var(--text-dim); }
  .screen{ padding:0 20px 18px 20px; flex:1; display:flex; flex-direction:column; }

  /* Home */
  .home-center{ flex:0 0 auto; display:flex; flex-direction:column; justify-content:center; align-items:stretch; padding:14px 0 4px 0; }
  .cta-day{
    display:block; width:100%; text-align:center; background:var(--accent);
    border:none; padding:26px 20px; margin-bottom:12px; border-radius:4px;
    color:#fff; cursor:pointer; font-family:inherit;
  }
  .cta-day .cta-label{ font-size:12px; letter-spacing:.06em; opacity:.85; margin:0 0 8px 0; }
  .cta-day .cta-title{ font-size:28px; font-weight:800; margin:0 0 6px 0; line-height:1.15; }
  .cta-day .cta-sub{ font-size:14px; opacity:.9; margin:0; }
  .switch-day{
    display:block; width:100%; text-align:center; background:none; border:none;
    color:var(--text-dim); font-size:14px; padding:8px; cursor:pointer; font-family:inherit;
    text-decoration:underline;
  }

  .program-section{ margin-top:22px; padding-top:16px; border-top:1px solid var(--line); }
  .program-section .sect-label{ font-size:12px; color:var(--text-dim); letter-spacing:.04em; margin-bottom:10px; }
  .program-row{ display:flex; align-items:center; gap:8px; margin-bottom:10px; }
  .program-row select{ flex:1; }
  .upload-label{
    display:inline-block; border:1px solid var(--line); background:var(--surface-2); color:var(--text-dim);
    padding:8px 12px; font-size:13px; cursor:pointer; border-radius:2px;
  }
  .upload-label input{ display:none; }
  .explore-toggle{
    background:none; border:none; color:var(--text-dim); font-size:13px; text-decoration:underline;
    padding:0; margin-top:4px; cursor:pointer; font-family:inherit;
  }
  .explore-panel{ margin-top:14px; }
  .explore-day{ margin-bottom:20px; }
  .explore-day .d-title{ font-size:15px; font-weight:800; margin-bottom:2px; }
  .explore-block-header{ font-size:12px; font-weight:800; letter-spacing:.06em; padding:10px 0 5px 0; margin-top:6px; border-bottom:1px solid var(--line); }
  .explore-block-header.blkP{ color:var(--good); }
  .explore-block-header.blkA{ color:var(--accent); }
  .explore-block-header.blkB{ color:var(--rest); }
  .explore-block-header.blkC{ color:var(--warn); }
  .explore-ex{ display:flex; align-items:baseline; gap:8px; padding:7px 0; font-size:13px; border-bottom:1px solid rgba(255,255,255,0.04); }
  .explore-ex .ex-num{ color:var(--text-dim); font-size:12px; min-width:18px; }
  .explore-ex .ex-name{ flex:1; }
  .explore-ex .ex-t{ color:var(--text-dim); font-size:12px; white-space:nowrap; }
  .error-text{ font-size:12px; color:var(--bad); margin:6px 0 0 0; }

  .btn{
    background:var(--accent); color:#fff; border:none; padding:10px 16px;
    font-weight:700; font-size:14px; cursor:pointer; border-radius:2px; font-family:inherit;
  }
  .btn.secondary{ background:transparent; color:var(--text); border:1px solid var(--line); }
  .btn.ghost{ background:transparent; color:var(--text-dim); border:none; text-decoration:underline; font-weight:400;}
  .summary-link{ background:var(--surface-2); color:var(--text); border:1px solid var(--line); padding:9px 14px; font-weight:700; font-size:14px; border-radius:2px; cursor:pointer; font-family:inherit; }
  .superserie-tag{ display:inline-block; font-size:10px; font-weight:800; letter-spacing:.04em; color:var(--pair); border:1px solid var(--pair); padding:1px 6px; border-radius:2px; margin-left:6px; vertical-align:middle; }
  .btn.small{ padding:6px 10px; font-size:12px;}
  .btn:disabled{ opacity:.4; cursor:not-allowed; }
  .btn.block{ width:100%; padding:16px; font-size:16px; }

  /* Session exec */
  .progress-line{ font-size:13px; color:var(--text-dim); margin-bottom:8px; }
  .progress-scale{ margin-bottom:20px; }
  .progress-scale-label{ font-size:15px; font-weight:700; color:var(--text); margin-bottom:8px; }
  .scale-track{ display:flex; gap:3px; }
  .scale-seg{ flex:1; min-width:0; height:14px; border-radius:2px; border:2px solid var(--line); background:transparent; padding:0; cursor:pointer; }
  .scale-seg.blkP{ border-color:var(--good); }
  .scale-seg.blkA{ border-color:var(--accent); }
  .scale-seg.blkB{ border-color:var(--rest); }
  .scale-seg.blkC{ border-color:var(--warn); }
  .scale-seg.done.blkP{ background:var(--good); }
  .scale-seg.done.blkA{ background:var(--accent); }
  .scale-seg.done.blkB{ background:var(--rest); }
  .scale-seg.done.blkC{ background:var(--warn); }
  .scale-seg.current{ height:20px; margin-top:-3px; outline:2px solid #fff; outline-offset:1px; }

  .new-exercise-flag{ display:inline-block; font-size:12px; font-weight:800; letter-spacing:.06em; color:#fff; background:var(--accent); padding:4px 10px; border-radius:2px; margin-bottom:12px; }

  .block-tag{ font-size:12px; font-weight:700; letter-spacing:.05em; color:var(--text-dim); margin-bottom:10px; }
  .block-tag.blkA{ color:var(--accent); }
  .block-tag.blkB{ color:var(--rest); }
  .block-tag.blkC{ color:var(--warn); }
  .block-tag.blkP{ color:var(--good); }

  .exercise-name{ font-size:30px; font-weight:800; line-height:1.15; margin:0 0 8px 0; }
  .exercise-tag{ display:inline-block; font-size:12px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--text-dim); background:var(--surface-2); padding:3px 9px; border-radius:2px; margin-bottom:12px; }
  .exercise-description{ font-size:15px; color:#C7CBCE; line-height:1.55; margin:0 0 14px 0; }
  .equip-chip{ display:inline-block; font-size:14px; font-weight:700; color:var(--text); background:var(--surface-2); border:1px solid var(--line); padding:9px 13px; border-radius:4px; margin-bottom:12px; }
  .equip-chip .config{ font-weight:400; color:var(--text-dim); font-size:13px; }
  .video-link{ display:inline-block; font-size:13px; color:var(--rest); text-decoration:underline; margin:0 0 14px 0; }
  .exercise-note-inline{ font-size:13px; color:var(--text-dim); font-style:italic; line-height:1.4; margin:0 0 14px 0; }
  .side-note{ font-size:13px; color:var(--rest); font-weight:700; margin:0 0 14px 0; }

  .pair-flag{ display:flex; align-items:center; gap:12px; background:var(--rest-dim); border-left:4px solid var(--rest); padding:14px; margin:6px 0 18px 0; border-radius:2px; }
  .pair-flag .pf-arrow{ font-size:24px; color:var(--rest); line-height:1; }
  .pair-flag .pf-text{ font-size:16px; font-weight:700; color:var(--text); line-height:1.3; }
  .pair-flag .pf-text b{ color:var(--rest); }

  .adjust-toggle{ background:none; border:none; color:var(--text-dim); font-size:13px; text-decoration:underline; padding:0; margin-top:2px; margin-right:16px; cursor:pointer; font-family:inherit; }

  .set-count{ font-size:18px; font-weight:800; margin:18px 0 14px 0; text-align:center; }

  .field-block{ text-align:center; margin-bottom:26px; }
  .field-label{ font-size:13px; color:var(--text-dim); margin-bottom:10px; }
  .stepper{ display:flex; align-items:center; justify-content:center; gap:26px; }
  .stepper button{
    width:48px; height:48px; border-radius:50%; border:1px solid var(--line); background:var(--surface-2);
    color:var(--text); font-size:22px; cursor:pointer;
  }
  .stepper .val{ font-size:32px; font-weight:800; min-width:90px; text-align:center; }
  .adjust-panel{ margin:18px 0; padding:14px 0; border-top:1px solid var(--line); border-bottom:1px solid var(--line); }

  .rpe-title{ font-size:16px; font-weight:700; text-align:center; margin:20px 0 16px 0; }
  .rpe-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:20px; }
  .rpe-card{
    border:1px solid var(--line); background:var(--surface); color:var(--text);
    padding:18px 10px; font-size:14px; font-weight:700; text-align:center; cursor:pointer; border-radius:2px;
    font-family:inherit; line-height:1.3;
  }
  .rpe-card:active{ background:var(--warn); border-color:var(--warn); color:#1a1a1a; }

  .start-btn{ width:100%; background:var(--accent); color:#fff; border:none; padding:28px 16px; border-radius:4px; cursor:pointer; font-family:inherit; margin-top:auto; text-align:center; }
  .start-btn .sb-label{ font-size:22px; font-weight:800; }
  .start-btn .sb-count{ font-size:14px; opacity:.85; font-weight:700; letter-spacing:.03em; margin-bottom:6px; }

  .active-hero{ text-align:center; margin:10px 0 14px 0; padding:22px 16px; background:var(--accent); border-radius:4px; }
  .active-hero.paused{ background:var(--surface-2); border:2px dashed var(--text-dim); }
  .active-hero.paused .h-label, .active-hero.paused .h-count, .active-hero.paused .h-detail, .active-hero.paused .h-weight{ color:var(--text); }
  .switch-hero, .transition-hero{ background:var(--pair); }
  .active-controls{ display:flex; flex-direction:column; gap:2px; }
  .nav-strip{ display:flex; gap:8px; margin-bottom:18px; }
  .nav-strip button{ flex:1; background:var(--surface-2); border:1px solid var(--line); color:var(--text); padding:11px; border-radius:2px; font-size:17px; cursor:pointer; font-family:inherit; }
  .nav-strip button:disabled{ opacity:.3; cursor:not-allowed; }
  .active-hero .h-label{ font-size:15px; letter-spacing:.08em; font-weight:800; color:#fff; opacity:.9; margin-bottom:14px; }
  .beat-ring{ width:16px; height:16px; border-radius:50%; background:#fff; margin:0 auto 14px auto; animation:beatpulse .5s ease-out; }
  @keyframes beatpulse{ 0%{ transform:scale(1.8); opacity:1; } 100%{ transform:scale(1); opacity:.75; } }
  .active-hero .h-count{ font-size:80px; font-weight:800; letter-spacing:-0.03em; color:#fff; font-variant-numeric:tabular-nums; margin-bottom:10px; line-height:1; }
  .active-hero .h-detail{ font-size:16px; color:#fff; opacity:.95; font-weight:700; margin-bottom:4px; }
  .active-hero .h-weight{ font-size:15px; color:#fff; opacity:.9; margin-top:10px; font-weight:700; }
  .finish-early{ display:block; width:100%; text-align:center; background:none; border:none; color:var(--text-dim); font-size:13px; text-decoration:underline; padding:6px; margin-bottom:8px; cursor:pointer; font-family:inherit; }

  .tempo-row{ display:flex; align-items:center; justify-content:center; gap:16px; margin-top:14px; }
  .tempo-row button{ width:34px; height:34px; border-radius:50%; border:1px solid rgba(255,255,255,0.5); background:rgba(255,255,255,0.12); color:#fff; font-size:18px; cursor:pointer; }
  .tempo-row .tempo-val{ font-size:15px; color:#fff; font-weight:700; min-width:80px; }
  .tempo-ok{ font-size:12px; color:#fff; opacity:.75; margin-top:6px; }
  .tempo-warn{ font-size:13px; color:var(--warn); font-weight:800; margin-top:8px; background:rgba(0,0,0,0.25); display:inline-block; padding:5px 10px; border-radius:2px; }

  /* DESCANSO — filled teal panel, unmistakably different from SERIE */
  .rest-hero{ text-align:center; margin:10px 0 14px 0; padding:26px 16px; background:var(--rest); border-radius:4px; }
  .rest-hero.paused{ background:var(--surface-2); border:2px dashed var(--text-dim); }
  .rest-hero.paused .h-label, .rest-hero.paused .h-timer{ color:var(--text); }

  .next-up{ margin-top:22px; padding:16px; background:var(--surface); border-left:3px solid var(--accent); }
  .next-up-label{ font-size:11px; font-weight:800; letter-spacing:.05em; color:var(--accent); margin-bottom:6px; }
  .next-up-name{ font-size:17px; font-weight:800; margin-bottom:2px; }
  .next-up-sub{ font-size:13px; color:var(--text-dim); margin-bottom:4px; }
  .next-up-target{ font-size:13px; color:var(--text-dim); }
  .rest-hero .h-label{ font-size:15px; letter-spacing:.08em; font-weight:800; color:#fff; opacity:.9; margin-bottom:12px; }
  .rest-hero .h-timer{ font-size:84px; font-weight:800; letter-spacing:-0.03em; color:#fff; font-variant-numeric:tabular-nums; margin-bottom:14px; line-height:1; }
  .rest-hero .h-timer.warn{ color:var(--warn); }
  .rest-hero .h-next{ font-size:14px; color:#fff; opacity:.9; }
  .rest-actions{ display:flex; gap:10px; justify-content:center; margin-top:16px; }

  /* Summary */
  .ex-row{ display:flex; align-items:center; justify-content:space-between; padding:14px 0; border-top:1px solid var(--line); width:100%; background:none; border-left:none; border-right:none; border-bottom:none; cursor:pointer; font-family:inherit; text-align:left; flex-wrap:wrap; gap:2px 10px; }
  .ex-row.nav:active{ background:var(--surface-2); }
  .ex-row-main{ display:flex; align-items:center; gap:8px; flex:1 1 auto; min-width:60%; }
  .ex-row-sub{ font-size:12px; color:var(--text-dim); flex:1 0 100%; padding-left:18px; }
  .block-dot{ width:11px; height:11px; border-radius:50%; flex-shrink:0; border:2px solid var(--text-dim); background:transparent; box-sizing:border-box; }
  .block-dot.blkP{ border-color:var(--good); }
  .block-dot.blkA{ border-color:var(--accent); }
  .block-dot.blkB{ border-color:var(--rest); }
  .block-dot.blkC{ border-color:var(--warn); }
  .ex-row.done .block-dot.blkP{ background:var(--good); }
  .ex-row.done .block-dot.blkA{ background:var(--accent); }
  .ex-row.done .block-dot.blkB{ background:var(--rest); }
  .ex-row.done .block-dot.blkC{ background:var(--warn); }
  .ex-row.current .block-dot{ outline:2px solid #fff; outline-offset:1px; }
  .ex-row .name{ font-size:14px; color:var(--text); }
  .ex-row .name.current{ font-weight:700; }
  .ex-row .status{ font-size:12px; color:var(--text-dim); }
  .ex-row .status.done{ color:var(--good); font-weight:700; }
  .ex-row .status.current{ color:var(--accent); font-weight:700; }
  .nav-hint{ font-size:12px; color:var(--text-dim); margin:16px 0 -4px 0; }
  .time-remaining{ background:var(--surface); border:1px solid var(--line); padding:16px; margin-bottom:16px; text-align:center; }
  .time-remaining .num{ font-size:34px; font-weight:800; }
  .time-remaining .lbl{ font-size:12px; color:var(--text-dim); }

  .stat-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px; }
  .stat-box{ background:var(--surface); border:1px solid var(--line); padding:12px; }
  .stat-box .num{ font-size:22px; font-weight:800; }
  .stat-box .lbl{ font-size:11px; color:var(--text-dim); }

  .hero{ padding:14px 0 12px 0; }
  .hero .eyebrow{ color:var(--text-dim); font-size:13px; margin:0 0 6px 0; }
  .hero h2{ font-size:26px; line-height:1.15; margin:0; font-weight:800; letter-spacing:-0.01em; }

  textarea{
    width:100%; background:var(--surface); border:1px solid var(--line); color:var(--text);
    padding:10px; font-family:inherit; font-size:13px; border-radius:2px; resize:vertical;
  }

  .navbar{
    position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:480px;
    background:var(--surface); border-top:1px solid var(--line);
    display:flex;
  }
  .navbar button{
    flex:1; background:none; border:none; color:var(--text-dim); padding:12px 0 10px 0;
    font-size:11px; font-family:inherit; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:3px;
  }
  .navbar button .ic{ font-size:18px; }
  .navbar button.active{ color:var(--accent); }
  .navbar button:disabled{ opacity:.3; cursor:not-allowed; }

  .empty-state{ color:var(--text-dim); font-size:13px; text-align:center; padding:40px 20px; border:1px dashed var(--line); }

  .chart-block{ margin-bottom:26px; }
  .chart-title{ font-size:13px; font-weight:700; margin-bottom:2px; }
  .chart-sub{ font-size:11px; color:var(--text-dim); margin-bottom:10px; }
  select{
    background:var(--surface-2); color:var(--text); border:1px solid var(--line); padding:6px 8px;
    font-family:inherit; font-size:12px;
  }
  .storage-note{ font-size:11px; color:var(--warn); background:var(--surface-2); padding:8px 10px; margin-bottom:14px; border-left:3px solid var(--warn); }

  .cal-block{ margin-bottom:28px; }
  .cal-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .cal-nav{ background:var(--surface-2); border:1px solid var(--line); color:var(--text); width:34px; height:34px; border-radius:2px; font-size:18px; cursor:pointer; font-family:inherit; }
  .cal-title{ font-size:15px; font-weight:800; }
  .cal-weekdays{ display:grid; grid-template-columns:repeat(7,1fr); text-align:center; font-size:11px; color:var(--text-dim); margin-bottom:4px; }
  .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:3px; }
  .cal-cell{ aspect-ratio:1; background:var(--surface); border:1px solid var(--line); border-radius:2px; display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer; font-family:inherit; color:var(--text); padding:0; position:relative; }
  .cal-cell.empty{ background:none; border:none; cursor:default; }
  .cal-cell.today{ border-color:var(--accent); border-width:2px; }
  .cal-cell.selected{ outline:2px solid #fff; outline-offset:1px; }
  .cal-daynum{ font-size:12px; }
  .cal-dot{ width:6px; height:6px; border-radius:50%; margin-top:3px; }
  .cal-dot.done{ background:var(--good); }
  .cal-dot.incomplete{ background:var(--warn); }
  .cal-dot.projected{ background:transparent; border:1.5px solid var(--pair); }
  .cal-legend{ display:flex; gap:14px; font-size:11px; color:var(--text-dim); margin-top:8px; flex-wrap:wrap; }
  .cal-legend i{ display:inline-block; width:6px; height:6px; border-radius:50%; margin-right:4px; }
  .cal-detail{ margin-top:14px; background:var(--surface); border:1px solid var(--line); padding:12px; border-radius:2px; }
  .cal-detail-head{ display:flex; align-items:center; gap:8px; margin-bottom:6px; }
  .cal-detail-day{ font-weight:700; font-size:14px; flex:1; }
  .cal-detail-status{ font-size:11px; color:var(--text-dim); }
  .cal-detail-stats{ display:flex; gap:14px; font-size:12px; color:var(--text-dim); }
  .cal-detail-notes{ font-size:12px; color:var(--text-dim); font-style:italic; margin-top:8px; }

  .radio-row{ display:flex; align-items:center; gap:8px; font-size:14px; padding:8px 0; cursor:pointer; }
  .schedule-sub{ display:flex; align-items:center; gap:8px; padding:4px 0 10px 26px; font-size:13px; color:var(--text-dim); }
  .schedule-sub select, .schedule-sub input{ background:var(--surface-2); color:var(--text); border:1px solid var(--line); padding:5px 8px; font-family:inherit; font-size:13px; }

  .export-section{ margin-top:30px; padding-top:18px; border-top:1px solid var(--line); }
  .export-section .sect-label{ font-size:12px; color:var(--text-dim); letter-spacing:.04em; margin-bottom:8px; }
  .export-help{ font-size:13px; color:var(--text-dim); line-height:1.4; margin:0 0 12px 0; }
  .export-actions{ display:flex; gap:10px; }
  .export-status{ font-size:12px; margin-top:8px; }
  .export-status.ok{ color:var(--good); }
  .export-status.error{ color:var(--bad); }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============================== DEFAULT PROGRAM ============================== */
/* Schema: program.days is a list — the tool supports any number of days, */
/* not just two. See formato-programa.md for the full field reference. */
const DEFAULT_PROGRAM = {
  label: "Mes 2 · Semana 2 · Reinicio",
  days: [
    {

/* ============================== STORAGE ============================== */
const HAS_NATIVE_STORAGE = typeof window.storage !== 'undefined';
let HAS_LOCAL_STORAGE = false;
try{ const __k='__master46_probe'; window.localStorage.setItem(__k,'1'); window.localStorage.removeItem(__k); HAS_LOCAL_STORAGE = true; }catch(e){ HAS_LOCAL_STORAGE = false; }
const IS_PERSISTENT = HAS_NATIVE_STORAGE || HAS_LOCAL_STORAGE;
let memoryStore = {};
async function storeGet(key){
  try{
    if(HAS_NATIVE_STORAGE){ const r = await window.storage.get(key,false); return r? JSON.parse(r.value): null; }
    if(HAS_LOCAL_STORAGE){ const v = window.localStorage.getItem(key); return v!==null ? JSON.parse(v) : null; }
    return memoryStore[key] ?? null;
  }catch(e){ return null; }
}
function storeSet(key,val){
  try{
    if(HAS_NATIVE_STORAGE){ window.storage.set(key, JSON.stringify(val), false).catch(()=>{}); }
    else if(HAS_LOCAL_STORAGE){ window.localStorage.setItem(key, JSON.stringify(val)); }
    else{ memoryStore[key]=val; }
  }catch(e){ console.error('storage error', e); }
}
function storeDelete(key){
  try{
    if(HAS_NATIVE_STORAGE){ window.storage.delete(key,false).catch(()=>{}); }
    else if(HAS_LOCAL_STORAGE){ window.localStorage.removeItem(key); }
    else{ delete memoryStore[key]; }
  }catch(e){}
}

/* ============================== HELPERS ============================== */
function buildSteps(exercises){
  const groups = []; const used = new Set();
  exercises.forEach(ex=>{
    if(used.has(ex.id)) return;
    if(ex.pair){
      const partner = exercises.find(e=>e.pair===ex.pair && e.id!==ex.id);
      if(partner && !used.has(partner.id)){
        groups.push([ex,partner]); used.add(ex.id); used.add(partner.id); return;
      }
    }
    groups.push([ex]); used.add(ex.id);
  });
  const steps = [];
  groups.forEach(group=>{
    const maxSeries = Math.max(...group.map(e=>e.series));
    for(let s=0;s<maxSeries;s++){
      group.forEach((ex,gi)=>{
        if(s<ex.series){
          steps.push({
            exerciseId: ex.id,
            setIndex: s+1,
            totalSets: ex.series,
            restAfter: gi===group.length-1,
            restSeconds: ex.rest,
            restLabel: ex.restLabel,
            pairedWith: group.length>1 ? group.filter(g=>g.id!==ex.id)[0].name : null
          });
        }
      });
    }
  });
  return steps;
}
function exByIdInSession(session,id){ return session.exercisesSnapshot.find(e=>e.id===id); }
function getActiveProgram(){ return PROGRAMS[state.activeProgramId] || PROGRAMS.default; }
function getDay(program, dayId){ return program.days.find(d=>d.id===dayId); }
function fmtTime(sec){
  sec = Math.max(0,Math.round(sec));
  const m = Math.floor(sec/60), s = sec%60;
  return m+":"+String(s).padStart(2,'0');
}
function fmtDate(iso){
  const d = new Date(iso);
  return d.toLocaleDateString('es-CL',{day:'2-digit',month:'short'});
}
function blockTagClass(block){ return {P:'blkP',A:'blkA',B:'blkB',C:'blkC'}[block]||''; }
function blockLabel(block){ return {P:'PREPARACIÓN',A:'BLOQUE A · FUERZA PESADA',B:'BLOQUE B · HIPERTROFIA',C:'BLOQUE C · POTENCIA'}[block]||''; }
function parseTargetSeconds(str){
  if(!str) return null;
  const m = String(str).trim().match(/^(\d+)\s*s$/i);
  return m ? parseInt(m[1],10) : null;
}
/* Unilateral exercises ("6 c/l" = 6 per side): both sides together count as ONE series. */
function isPerSide(repsTarget){
  return /c\s*\/\s*l/i.test(String(repsTarget||'')) || /cada\s+lado/i.test(String(repsTarget||''));
}

/* ============================== SESSION DISTRIBUTION / CALENDAR ============================== */
const WEEKDAY_NAMES = ['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
function localYMD(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function mondayFirstWeekday(dateObj){ return (dateObj.getDay()+6)%7; } // 0=Monday..6=Sunday
function computeWeekdayOffsets(n, startWeekday){
  // startWeekday: 1=Monday..7=Sunday. Spread n sessions evenly across the week from that anchor.
  const offsets = [];
  for(let i=0;i<n;i++){ offsets.push(((startWeekday-1) + Math.round(i*7/n)) % 7); }
  return offsets;
}
function getEffectiveScheduleConfig(program){
  const cfg = state.scheduleConfig;
  if(cfg.mode!=='program') return cfg;
  const rec = program.schedule;
  if(rec && rec.recommendedMode==='interval') return { mode:'interval', intervalDays: rec.recommendedIntervalDays||3 };
  if(rec && rec.recommendedMode==='weekdays' && Array.isArray(rec.recommendedWeekdays)){
    return { mode:'weekday', explicitWeekdays: rec.recommendedWeekdays };
  }
  return { mode:'weekday', startWeekday:1 }; // program has no recommendation -> sensible default
}
function computeIntervalAnchor(program){
  if(state.history.length>0){
    const last = state.history[state.history.length-1];
    return { date: new Date(last.date), lastDayIndex: program.days.findIndex(d=>d.id===last.day) };
  }
  return { date: new Date(), lastDayIndex: -1 };
}
function getProjectedDayForDate(dateObj, program){
  const days = program.days;
  const n = days.length;
  if(n===0) return null;
  const dStr = localYMD(dateObj);
  const todayStr = localYMD(new Date());
  if(dStr < todayStr) return null; // only project today and the future
  const cfg = getEffectiveScheduleConfig(program);
  if(cfg.mode==='interval'){
    const {date:anchor, lastDayIndex} = computeIntervalAnchor(program);
    const anchorMid = new Date(anchor.getFullYear(),anchor.getMonth(),anchor.getDate());
    const targetMid = new Date(dateObj.getFullYear(),dateObj.getMonth(),dateObj.getDate());
    const diffDays = Math.round((targetMid-anchorMid)/86400000);
    if(diffDays<=0 || diffDays % cfg.intervalDays!==0) return null;
    const k = diffDays/cfg.intervalDays;
    const idx = ((lastDayIndex + k) % n + n) % n;
    return days[idx];
  }
  // weekday mode (either user-chosen start day, or an explicit list recommended by the program)
  const offsets = cfg.explicitWeekdays ? cfg.explicitWeekdays.map(w=>(w-1+7)%7) : computeWeekdayOffsets(n, cfg.startWeekday||1);
  const wd = mondayFirstWeekday(dateObj);
  const idx = offsets.indexOf(wd);
  if(idx===-1 || idx>=n) return null;
  return days[idx];
}
function setScheduleMode(mode){ state.scheduleConfig.mode=mode; persistScheduleConfig(); render(); }
function setStartWeekday(v){ state.scheduleConfig.startWeekday=parseInt(v,10); persistScheduleConfig(); render(); }
function setIntervalDays(v){ state.scheduleConfig.intervalDays=Math.max(1,parseInt(v,10)||1); persistScheduleConfig(); render(); }
function persistScheduleConfig(){ storeSet('master46_schedule_config', state.scheduleConfig); }

function changeCalendarMonth(delta){
  state.calendarMonth += delta;
  if(state.calendarMonth<0){ state.calendarMonth=11; state.calendarYear--; }
  if(state.calendarMonth>11){ state.calendarMonth=0; state.calendarYear++; }
  state.selectedCalendarDate=null;
  render();
}
function selectCalendarDate(dateStr){
  state.selectedCalendarDate = state.selectedCalendarDate===dateStr ? null : dateStr;
  render();

function renderCalendar(){
  const program = getActiveProgram();
  const year=state.calendarYear, month=state.calendarMonth;
  const first = new Date(year, month, 1);
  const startOffset = mondayFirstWeekday(first);
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const todayStr = localYMD(new Date());

  const byDate = {};
  state.history.forEach(r=>{
    const ds = localYMD(new Date(r.date));
    if(!byDate[ds]) byDate[ds]=[];
    byDate[ds].push(r);
  });

  const monthNames = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  let cells = '';
  for(let i=0;i<startOffset;i++) cells += `<div class="cal-cell empty"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const dateObj = new Date(year, month, d);
    const dateStr = localYMD(dateObj);
    const recs = byDate[dateStr]||[];
    let dotCls = '';
    if(recs.some(r=>r.status==='completed'||!r.status)) dotCls='done';
    else if(recs.some(r=>r.status==='incomplete')) dotCls='incomplete';
    const isToday = dateStr===todayStr;
    const isSelected = state.selectedCalendarDate===dateStr;
    const projected = dotCls ? null : getProjectedDayForDate(dateObj, program);
    cells += `<button class="cal-cell ${isToday?'today':''} ${isSelected?'selected':''}" onclick="selectCalendarDate('${dateStr}')" title="${projected?projected.label:''}">
      <span class="cal-daynum">${d}</span>
      ${dotCls? `<span class="cal-dot ${dotCls}"></span>` : (projected? `<span class="cal-dot projected"></span>` : '')}
    </button>`;
  }

  let detail = '';
  if(state.selectedCalendarDate){
    const recs = byDate[state.selectedCalendarDate];
    if(recs){
      detail = recs.map(r=>{
        const statusLabel = r.status==='incomplete' ? 'Incompleta' : 'Completada';
        const statusCls = r.status==='incomplete' ? 'incomplete' : 'done';
        return `<div class="cal-detail">
          <div class="cal-detail-head">
            <span class="cal-dot ${statusCls}"></span>
            <span class="cal-detail-day">${r.dayLabel||r.day}</span>
            <span class="cal-detail-status">${statusLabel}</span>
          </div>
          <div class="cal-detail-stats">
            <span>${(r.totalVolume||0).toLocaleString('es-CL')} kg</span>
            <span>RPE ${r.avgRpe?r.avgRpe.toFixed(1):'—'}</span>
            <span>${Math.round((r.durationSec||0)/60)} min</span>
          </div>
          ${r.notes? `<p class="cal-detail-notes">"${r.notes}"</p>`:''}
        </div>`;
      }).join('');
    } else {
      const dObj = new Date(state.selectedCalendarDate+'T00:00:00');
      const projected = getProjectedDayForDate(dObj, program);
      detail = `<div class="cal-detail">
        <div class="cal-detail-head">
          <span class="cal-dot projected"></span>
          <span class="cal-detail-day">${projected? projected.label : 'Sin sesión programada'}</span>
          <span class="cal-detail-status">${projected? 'Programada':''}</span>
        </div>
      </div>`;
    }
  }

  return `<div class="cal-block">
    <div class="cal-header">
      <button class="cal-nav" onclick="changeCalendarMonth(-1)">‹</button>
      <div class="cal-title">${monthNames[month]} ${year}</div>
      <button class="cal-nav" onclick="changeCalendarMonth(1)">›</button>
    </div>
    <div class="cal-weekdays"><span>L</span><span>M</span><span>M</span><span>J</span><span>V</span><span>S</span><span>D</span></div>
    <div class="cal-grid">${cells}</div>
    <div class="cal-legend"><span><i class="cal-dot done"></i> Completada</span><span><i class="cal-dot incomplete"></i> Incompleta</span><span><i class="cal-dot projected"></i> Programada</span></div>
    ${detail}
    <button class="explore-toggle" onclick="goSettings()">⚙ Cambiar distribución de sesiones</button>
  </div>`;
}

/* Generated tones (Web Audio), no external files needed. */
let audioCtx = null;
function getAudioCtx(){
  if(!audioCtx){
    try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ return null; }
  }
  if(audioCtx.state==='suspended'){ audioCtx.resume().catch(()=>{}); }
  return audioCtx;
}
function playTone(freq, durationMs, {type='sine', volume=0.22, delay=0}={}){
  if(!state.soundOn) return;
  const ctx = getAudioCtx();
  if(!ctx) return;
  const t0 = ctx.currentTime + delay;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t0);
  gain.gain.setValueAtTime(0, t0);
  gain.gain.linearRampToValueAtTime(volume, t0+0.01);
  gain.gain.setValueAtTime(volume, t0+durationMs/1000*0.6);
  gain.gain.exponentialRampToValueAtTime(0.001, t0+durationMs/1000);
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start(t0);
  osc.stop(t0+durationMs/1000+0.03);
}
/* Tick: marks each rep/second of the count. Punchy square wave cuts through gym noise. */
function playTick(){ playTone(1046, 110, {type:'square', volume:0.45}); }
/* Start of a set: sharp two-note rising signal. */
function playStartChime(){
  playTone(659,150,{type:'square', volume:0.6});
  playTone(880,240,{type:'square', volume:0.6, delay:0.16});
}
/* End of a set: the loudest, most distinct marker — three rising notes. */
function playDoneChime(){
  playTone(880,150,{type:'square', volume:0.65});
  playTone(1175,150,{type:'square', volume:0.65, delay:0.16});
  playTone(1568,300,{type:'square', volume:0.65, delay:0.32});
}
/* Rest begins: calmer but still clearly audible. */
function playRestStartTone(){ playTone(392,300,{type:'triangle', volume:0.45}); }
/* Switch sides mid-set (unilateral exercises). */
/* Switch sides mid-set (unilateral exercises), or hand off to the paired exercise
   with no rest — same "keep going, one tap" family, same color, own sound each. */
function playSideSwitchChime(){
  playTone(494,130,{type:'triangle', volume:0.5});
  playTone(494,130,{type:'triangle', volume:0.5, delay:0.18});
}
function playTransitionChime(){
  playTone(587,120,{type:'triangle', volume:0.55});
  playTone(440,120,{type:'triangle', volume:0.55, delay:0.14});
  playTone(587,160,{type:'triangle', volume:0.55, delay:0.28});
}
/* Rest ends / go time: the strongest, most alarm-like signal in the app. */
function playRestGoChime(){
  playTone(659,140,{type:'square', volume:0.7});
  playTone(880,140,{type:'square', volume:0.7, delay:0.15});
  playTone(1175,140,{type:'square', volume:0.7, delay:0.30});
  playTone(1568,360,{type:'square', volume:0.7, delay:0.45});
}

let wakeLockRef = null;
async function requestWakeLock(){
  try{
    if(typeof navigator !== 'undefined' && 'wakeLock' in navigator){
      wakeLockRef = await navigator.wakeLock.request('screen');
    }
  }catch(e){ /* denied, unsupported, or low battery — fail silently */ }
}
function releaseWakeLock(){
  try{ if(wakeLockRef){ wakeLockRef.release().catch(()=>{}); wakeLockRef=null; } }catch(e){}
}
if(typeof document !== 'undefined' && document.addEventListener){
  document.addEventListener('visibilitychange', ()=>{
    if(document.visibilityState==='visible' && state.activeSession &&
       ((state.sessionSubview==='exec' && state.setPhase==='active' && !state.setPaused) ||
        (state.sessionSubview==='rest' && !state.restPaused))){
      requestWakeLock();
    }
  });
}
/* Best-effort background alert. Works only while the browser tab/PWA process is
   still alive in the background — mainly Android; iOS Safari support is limited
   even when installed to the home screen. Not a substitute for keeping it open. */
async function ensureNotificationPermission(){
  try{
    if('Notification' in window && Notification.permission==='default'){
      await Notification.requestPermission();
    }
  }catch(e){}
}
function notifyIfHidden(title, body){
  try{
    if(typeof document !== 'undefined' && document.visibilityState==='hidden' &&
       'Notification' in window && Notification.permission==='granted'){
      new Notification(title, {body, icon:'icon-192.png'});
    }
  }catch(e){}
}

/* ============================== STATE ============================== */
let state = {
  view:'home',
  sessionSubview:'exec',
  activeSession:null,
  history:[],
  activeProgramId:'default',
  exploreOpen:false,
  showOtherDays:false,
  programUploadError:null,
  restRemaining:0,
  restTimerHandle:null,
  setTimerHandle:null,
  setPhase:'ready', // ready | active | logging
  setElapsed:0,
  repCount:0,
  currentTempo:3,
  draft:{carga:0, reps:0, rpe:null},
  adjustOpen:false,
  savedNotesDraft:'',
  selectedProgressExName:null,
  soundOn:true,
  sideIndex:null,
  setPaused:false,
  restPaused:false,
  importMessage:null,
  importError:null,
  calendarMonth: new Date().getMonth(),
  calendarYear: new Date().getFullYear(),
  selectedCalendarDate: null,
  scheduleConfig: { mode:'weekday', startWeekday:1, intervalDays:3 }

async function init(){
  state.history = await storeGet('master46_history') || [];
  const storedPrograms = await storeGet('master46_programs');
  if(storedPrograms) PROGRAMS = { default: DEFAULT_PROGRAM, ...storedPrograms };
  const storedActiveId = await storeGet('master46_active_program_id');
  if(storedActiveId && PROGRAMS[storedActiveId]) state.activeProgramId = storedActiveId;
  const storedSound = await storeGet('master46_sound_on');
  if(storedSound !== null) state.soundOn = storedSound;
  const storedSchedule = await storeGet('master46_schedule_config');
  if(storedSchedule) state.scheduleConfig = {...state.scheduleConfig, ...storedSchedule};
  const active = await storeGet('master46_active_session');
  if(active) state.activeSession = active;
  render();
}

/* ============================== PROGRAM UPLOAD & VALIDATION ============================== */
function validateProgram(data){
  const errors = [];
  if(!data.label) errors.push('falta "label"');
  if(!Array.isArray(data.days) || data.days.length===0){ errors.push('falta "days" (lista no vacía de días)'); return errors; }
  const dayIds = new Set();
  data.days.forEach((d,di)=>{
    const dtag = `days[${di}]`;
    if(!d.id) errors.push(`${dtag}: falta "id"`);
    else { if(dayIds.has(d.id)) errors.push(`${dtag}: id de día "${d.id}" repetido`); dayIds.add(d.id); }
    if(!d.label) errors.push(`${dtag}: falta "label"`);
    if(!Array.isArray(d.exercises) || d.exercises.length===0){ errors.push(`${dtag}: falta "exercises" (lista no vacía)`); return; }
    const ids = new Set();
    d.exercises.forEach((e,i)=>{
      const tag = `${dtag}.exercises[${i}]`;
      ['id','block','name','description','series','repsTarget','repsNum','rest','restLabel'].forEach(f=>{
        if(e[f]===undefined || e[f]===null) errors.push(`${tag}: falta "${f}"`);
      });
      if(e.carga===undefined) errors.push(`${tag}: falta "carga" (usa 0 si no hay peso)`);
      if(e.block && !['P','A','B','C'].includes(e.block)) errors.push(`${tag}: "block" debe ser P, A, B o C`);
      if(e.id){ if(ids.has(e.id)) errors.push(`${tag}: id "${e.id}" repetido en este día`); ids.add(e.id); }
    });
  });
  return errors;
}
function handleProgramUpload(input){
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try{
      const data = JSON.parse(e.target.result);
      const errors = validateProgram(data);
      if(errors.length){
        state.programUploadError = 'El archivo no calza con el formato: ' + errors.slice(0,4).join('; ') + (errors.length>4?'; ...':'') + '. Revisa formato-programa.md.';
        render(); return;
      }
      const id = 'prog_'+Date.now();
      PROGRAMS[id] = data;
      state.activeProgramId = id;
      state.programUploadError = null;
      state.exploreOpen = false;
      storeSet('master46_programs', Object.fromEntries(Object.entries(PROGRAMS).filter(([k])=>k!=='default')));
      storeSet('master46_active_program_id', id);
      render();
    }catch(err){
      state.programUploadError = 'No se pudo leer el archivo: no es un JSON válido.';
      render();
    }
  };
  reader.readAsText(file);
  input.value = '';
}
function switchProgram(id){
  state.activeProgramId = id;
  state.programUploadError = null;
  state.showOtherDays = false;
  storeSet('master46_active_program_id', id);
  render();
}
function toggleExplore(){ state.exploreOpen = !state.exploreOpen; render(); }

/* ============================== SESSION LOGIC ============================== */
function suggestedDay(){
  const ids = getActiveProgram().days.map(d=>d.id);
  if(state.history.length===0) return ids[0];
  const last = state.history[state.history.length-1];
  const idx = ids.indexOf(last.day);
  if(idx===-1) return ids[0];
  return ids[(idx+1) % ids.length];
}
function resetStepUiFlags(){
  state.setPhase='ready'; state.setElapsed=0; state.repCount=0; state.adjustOpen=false;
  state.sideIndex=null; state.setPaused=false;
  if(state.setTimerHandle){ clearInterval(state.setTimerHandle); state.setTimerHandle=null; }
}
function startSession(dayId){
  ensureNotificationPermission();
  requestWakeLock();
  const program = getActiveProgram();
  const dayData = getDay(program, dayId);
  const exercises = dayData.exercises;
  const steps = buildSteps(exercises);
  state.activeSession = {
    day: dayId,
    programId: state.activeProgramId,
    programLabel: program.label,
    dayLabel: dayData.label,
    daySubtitle: dayData.subtitle,
    exercisesSnapshot: exercises,
    steps, currentStepIndex:0, logs:{}, startTime: Date.now()
  };
  state.sessionSubview='exec';
  resetStepUiFlags();
  loadDraftForCurrentStep();
  state.view='session';
  persistActiveSession();
  render();
}
function resumeSession(){
  requestWakeLock();
  state.view='session'; state.sessionSubview='exec';
  loadDraftForCurrentStep();
  render();
}
function discardSession(){
  releaseWakeLock();
  clearAnyRunningTimers();
  const s = state.activeSession;
  if(s && Object.keys(s.logs||{}).length>0){
    // some sets were actually done before abandoning — worth remembering on the calendar
    const {avgRpe, totalVolume} = sessionAggregates();
    const durationSec = Math.round((Date.now()-s.startTime)/1000);
    state.history.push({
      id: 'sess_'+Date.now(),
      date: new Date().toISOString(),
      day: s.day,
      programLabel: s.programLabel,
      dayLabel: s.dayLabel,
      avgRpe, totalVolume, durationSec,
      notes: '',
      logs: s.logs,
      status: 'incomplete'
    });
    storeSet('master46_history', state.history);
  }
  state.activeSession=null;
  storeDelete('master46_active_session');
  render();
}
function persistActiveSession(){ storeSet('master46_active_session', state.activeSession); }
function currentStep(){
  const s = state.activeSession;
  if(!s) return null;
  return s.steps[s.currentStepIndex] || null;
}
function loadDraftForCurrentStep(){
  const step = currentStep();
  if(!step){ return; }
  const ex = exByIdInSession(state.activeSession, step.exerciseId);
  const key = step.exerciseId+'-'+step.setIndex;
  const prior = state.activeSession.logs[key];
  state.draft = prior ? {...prior} : {carga: ex.carga, reps: ex.repsNum, rpe: null};
  resetStepUiFlags();
}
function adjustDraft(field, delta){
  state.draft[field] = Math.max(0, +( (state.draft[field]||0) + delta ).toFixed(2));
  render();
}
function toggleAdjust(){ state.adjustOpen = !state.adjustOpen; render(); }

/* Guided counting: paces reps by tempo, or counts a timed hold, and finishes
   automatically at the prescribed amount — no manual "done" tap needed.
   Unilateral ("c/l") exercises count side 1, prompt a side switch, then count
   side 2 — both sides together are ONE series. */
function startRepInterval(){
  const step = currentStep();
  const ex = exByIdInSession(state.activeSession, step.exerciseId);
  const targetReps = state.draft.reps || ex.repsNum;
  if(state.setTimerHandle) clearInterval(state.setTimerHandle);
  state.setTimerHandle = setInterval(()=>{
    state.repCount += 1;
    if(state.repCount>=targetReps){
      clearInterval(state.setTimerHandle); state.setTimerHandle=null;
      if(state.sideIndex===1){
        state.sideIndex = 2;
        state.repCount = 0;
        state.setPhase = 'switch';
        playSideSwitchChime();
        render();
      }else{
        markSetDone();
      }
    }else{ playTick(); render(); }
  }, state.currentTempo*1000);
}
function startTimeInterval(){
  const step = currentStep();
  const ex = exByIdInSession(state.activeSession, step.exerciseId);
  const targetSeconds = parseTargetSeconds(ex.repsTarget);
  if(state.setTimerHandle) clearInterval(state.setTimerHandle);
  state.setTimerHandle = setInterval(()=>{
    state.setElapsed += 1;
    if(state.setElapsed>=targetSeconds){
      clearInterval(state.setTimerHandle); state.setTimerHandle=null;
      markSetDone();
    }else{
      if(targetSeconds-state.setElapsed<=3) playTick();
      render();
    }
  },1000);
}
function beginSet(){
  const step = currentStep();
  const ex = exByIdInSession(state.activeSession, step.exerciseId);
  const targetSeconds = parseTargetSeconds(ex.repsTarget);
  state.setPhase='active'; state.setElapsed=0; state.repCount=0; state.setPaused=false;
  state.sideIndex = isPerSide(ex.repsTarget) ? 1 : null;
  state.currentTempo = ex.tempoSeconds || 3;
  if(state.setTimerHandle) clearInterval(state.setTimerHandle);
  playStartChime();
  requestWakeLock();
  if(targetSeconds!==null){ startTimeInterval(); } else { startRepInterval(); }
  render();
}
function continueToOtherSide(){
  state.setPhase='active';
  startRepInterval();
  render();
}
function toggleSetPause(){
  if(state.setTimerHandle){
    clearInterval(state.setTimerHandle); state.setTimerHandle=null;
    state.setPaused = true;
  }else if(state.setPaused){
    state.setPaused = false;
    const step = currentStep();
    const ex = exByIdInSession(state.activeSession, step.exerciseId);
    const targetSeconds = parseTargetSeconds(ex.repsTarget);
    if(targetSeconds!==null){ startTimeInterval(); } else { startRepInterval(); }
  }
  render();
}
function adjustTempo(delta){
  state.currentTempo = Math.max(1, +(state.currentTempo + delta).toFixed(1));
  if(!state.setPaused) startRepInterval();
  render();
}
function isLastSetOfExercise(step){ return step.setIndex === step.totalSets; }
function logCurrentSet(rpeValue){
  const step = currentStep();
  const ex = exByIdInSession(state.activeSession, step.exerciseId);
  const key = step.exerciseId+'-'+step.setIndex;
  state.activeSession.logs[key] = {...state.draft, rpe: rpeValue, name: ex.name, keyMetric: !!ex.keyMetric};
  persistActiveSession();
}
function markSetDone(){
  if(state.setTimerHandle){ clearInterval(state.setTimerHandle); state.setTimerHandle=null; }
  state.setPaused=false;
  playDoneChime();
  notifyIfHidden('Serie completa', 'Anota cómo se sintió cuando vuelvas a la app');
  const step = currentStep();
  if(isLastSetOfExercise(step)){
    state.setPhase='logging'; // ask RPE once, at the end of the exercise
  }else{
    logCurrentSet(null);
    proceedAfterSet();
  }
  render();
}
function chooseRpe(v){
  const step = currentStep();
  logCurrentSet(v);
  // backfill: earlier sets of this same exercise (this session) share the same RPE
  const exId = step.exerciseId;
  Object.keys(state.activeSession.logs).forEach(key=>{
    if(key.startsWith(exId+'-')){
      const l = state.activeSession.logs[key];
      if(l.rpe===null || l.rpe===undefined) l.rpe = v;
    }
  });
  persistActiveSession();
  proceedAfterSet();
}
function proceedAfterSet(){
  const step = currentStep();
  if(step.restAfter){
    state.sessionSubview='rest';
    state.restRemaining = step.restSeconds;
    state.restPaused = false;
    playRestStartTone();
    runRestTimer();
  }else{
    state.setPhase='transition';
    playTransitionChime();
  }
  render();
}
function continueTransition(){
  advanceStep();
  render();
}
function toggleRestPause(){
  if(state.restTimerHandle){
    clearInterval(state.restTimerHandle); state.restTimerHandle=null;
    state.restPaused = true;
  }else if(state.restPaused){
    state.restPaused = false;
    runRestTimer();
  }
  render();
}
function runRestTimer(){
  if(state.restTimerHandle) clearInterval(state.restTimerHandle);
  state.restTimerHandle = setInterval(()=>{
    state.restRemaining -= 1;
    if(state.restRemaining<=0){
      clearInterval(state.restTimerHandle);
      state.restTimerHandle=null;
      playRestGoChime();
      notifyIfHidden('Descanso terminado', 'Es hora de la siguiente serie');
      advanceStep();
    } else if(state.restRemaining<=3){
      playTick();
    }
    render();
  },1000);
}
function skipRest(){
  if(state.restTimerHandle){ clearInterval(state.restTimerHandle); state.restTimerHandle=null; }
  advanceStep();
  render();
}
function adjustRest(delta){
  state.restRemaining = Math.max(0, state.restRemaining+delta);
  render();
}
function clearAnyRunningTimers(){
  if(state.setTimerHandle){ clearInterval(state.setTimerHandle); state.setTimerHandle=null; }
  if(state.restTimerHandle){ clearInterval(state.restTimerHandle); state.restTimerHandle=null; }
  state.setPaused=false; state.restPaused=false;
}
function stepBack(){
  const s = state.activeSession;
  if(!s || s.currentStepIndex<=0) return;
  clearAnyRunningTimers();
  s.currentStepIndex -= 1;
  state.sessionSubview='exec';
  loadDraftForCurrentStep();
  persistActiveSession();
  render();
}
function stepForward(){
  const s = state.activeSession;
  if(!s || s.currentStepIndex>=s.steps.length-1) return;
  clearAnyRunningTimers();
  s.currentStepIndex += 1;
  state.sessionSubview='exec';
  loadDraftForCurrentStep();
  persistActiveSession();
  render();
}
function advanceStep(){
  const s = state.activeSession;
  s.currentStepIndex += 1;
  if(s.currentStepIndex >= s.steps.length){
    state.sessionSubview='complete';
  }else{
    state.sessionSubview='exec';
    loadDraftForCurrentStep();
  }
  persistActiveSession();
}
function estimateRemainingSeconds(){
  const s = state.activeSession;
  let total=0;
  for(let i=s.currentStepIndex;i<s.steps.length;i++){
    total += SET_EXEC_SECONDS;
    if(s.steps[i].restAfter) total += s.steps[i].restSeconds;
  }
  return total;
}
function sessionAggregates(){
  const s = state.activeSession;
  const logs = Object.values(s.logs);
  const rpes = logs.map(l=>l.rpe).filter(v=>v!==null && v!==undefined);
  const avgRpe = rpes.length ? (rpes.reduce((a,b)=>a+b,0)/rpes.length) : null;
  const totalVolume = logs.reduce((acc,l)=> acc + (l.carga||0)*(l.reps||0), 0);
  return {avgRpe, totalVolume};
}
function finalizeSession(){
  releaseWakeLock();
  clearAnyRunningTimers();
  const s = state.activeSession;
  const {avgRpe, totalVolume} = sessionAggregates();
  const durationSec = Math.round((Date.now()-s.startTime)/1000);
  const record = {
    id: 'sess_'+Date.now(),
    date: new Date().toISOString(),
    day: s.day,
    programLabel: s.programLabel,
    dayLabel: s.dayLabel,
    avgRpe, totalVolume, durationSec,
    notes: state.savedNotesDraft||'',
    logs: s.logs,
    status: 'completed'
  };
  state.history.push(record);
  storeSet('master46_history', state.history);
  storeDelete('master46_active_session');
  state.activeSession=null;
  state.savedNotesDraft='';
  state.view='home';
  render();
}

/* ============================== CHARTS ============================== */
function lineChart(points, {w=420,h=140,color='#BF4427',yFmt=(v)=>v}={}){
  if(points.length===0) return '<div class="empty-state">Sin datos todavía.</div>';
  const pad = {l:34,r:12,t:10,b:22};
  const ys = points.map(p=>p.y);
  const minY = Math.min(...ys,0), maxY = Math.max(...ys,1);
  const scaleX = i => pad.l + (points.length<=1?0:(i/(points.length-1))*(w-pad.l-pad.r));
  const scaleY = v => h-pad.b - ((v-minY)/((maxY-minY)||1))*(h-pad.t-pad.b);
  const path = points.map((p,i)=> (i===0?'M':'L')+scaleX(i)+','+scaleY(p.y)).join(' ');
  const dots = points.map((p,i)=>`<circle cx="${scaleX(i)}" cy="${scaleY(p.y)}" r="3" fill="${color}"/>`).join('');
  const labels = points.map((p,i)=> i%Math.ceil(points.length/6||1)===0 ? `<text x="${scaleX(i)}" y="${h-6}" font-size="9" fill="#9AA1A6" text-anchor="middle">${p.x}</text>`:'').join('');
  const gridY = `<line x1="${pad.l}" y1="${scaleY(minY)}" x2="${w-pad.r}" y2="${scaleY(minY)}" stroke="#333A3F" stroke-width="1"/>`;
  const yLabel = `<text x="4" y="${scaleY(maxY)+4}" font-size="9" fill="#9AA1A6">${yFmt(maxY)}</text>`;
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}">${gridY}${yLabel}<path d="${path}" fill="none" stroke="${color}" stroke-width="2"/>${dots}${labels}</svg>`;
}
function barChart(points, {w=420,h=140,color='#3E7C74',yFmt=(v)=>v}={}){
  if(points.length===0) return '<div class="empty-state">Sin datos todavía.</div>';
  const pad = {l:34,r:12,t:10,b:22};
  const maxY = Math.max(...points.map(p=>p.y),1);
  const gap = (w-pad.l-pad.r)/points.length;
  const bw = gap*0.6;
  const bars = points.map((p,i)=>{
    const x = pad.l + i*gap + (gap-bw)/2;
    const barH = ((p.y/maxY)||0)*(h-pad.t-pad.b);
    const y = h-pad.b-barH;
    return `<rect x="${x}" y="${y}" width="${bw}" height="${barH}" fill="${color}"/>`;
  }).join('');
  const labels = points.map((p,i)=>{
    const x = pad.l + i*gap + gap/2;
    return `<text x="${x}" y="${h-6}" font-size="9" fill="#9AA1A6" text-anchor="middle">${p.x}</text>`;
  }).join('');
  const yLabel = `<text x="4" y="${pad.t+8}" font-size="9" fill="#9AA1A6">${yFmt(maxY)}</text>`;
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}">${yLabel}${bars}${labels}</svg>`;
}

/* ============================== RENDER ============================== */
function render(){
  const app = document.getElementById('app');
  let html = '';
  if(state.view==='home') html = renderHome();
  else if(state.view==='session') html = renderSession();
  else if(state.view==='progress') html = renderProgress();
  else if(state.view==='settings') html = renderSettings();
  html += renderNav();
  app.innerHTML = html;
}
function renderNav(){
  return `<div class="navbar">
    <button class="${state.view==='home'?'active':''}" onclick="goHome()"><span class="ic">🏠</span>Inicio</button>
    <button class="${state.view==='session'?'active':''}" ${!state.activeSession?'disabled':''} onclick="goSession()"><span class="ic">📋</span>Sesión</button>
    <button class="${state.view==='progress'?'active':''}" onclick="goProgress()"><span class="ic">📈</span>Progreso</button>
    <button class="${state.view==='settings'?'active':''}" onclick="goSettings()"><span class="ic">⚙️</span>Ajustes</button>
  </div>`;
}
function goHome(){ state.view='home'; render(); }
function goSession(){ if(state.activeSession){ state.view='session'; render(); } }
function goProgress(){ state.view='progress'; render(); }
function goSettings(){ state.view='settings'; render(); }

/* ============================== SWIPE BETWEEN TABS ============================== */
function getTabOrder(){
  const order = ['home'];
  if(state.activeSession) order.push('session');
  order.push('progress','settings');
  return order;
}
let touchStartX=null, touchStartY=null;
function handleTouchStart(e){
  if(e.touches.length!==1) return;
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
}
function handleTouchEnd(e){
  if(touchStartX===null) return;
  const t = e.changedTouches[0];
  const dx = t.clientX - touchStartX;
  const dy = t.clientY - touchStartY;
  touchStartX=null; touchStartY=null;
  if(Math.abs(dx)<70 || Math.abs(dy)>60) return;
  const order = getTabOrder();
  const idx = order.indexOf(state.view);
  if(idx===-1) return;
  if(dx<0 && idx<order.length-1){ state.view=order[idx+1]; render(); }
  else if(dx>0 && idx>0){ state.view=order[idx-1]; render(); }
}
if(typeof document !== 'undefined' && document.addEventListener){
  document.addEventListener('touchstart', handleTouchStart, {passive:true});
  document.addEventListener('touchend', handleTouchEnd, {passive:true});
}

function renderExploreDay(d){
  let lastBlock = null; let counter = 0;
  const rows = d.exercises.map(e=>{
    counter++;
    let header = '';
    if(e.block !== lastBlock){
      header = `<div class="explore-block-header ${blockTagClass(e.block)}">${blockLabel(e.block)}</div>`;
      lastBlock = e.block;
    }
    return header + `<div class="explore-ex"><span class="ex-num">${counter}.</span><span class="ex-name">${e.name}</span><span class="ex-t">${e.repsTarget}${e.carga>0?' · '+e.carga+(e.unit?' '+e.unit:''):''}${e.equipment?' · '+e.equipment:''}${e.discConfig?' ('+e.discConfig+')':''}</span></div>`;
  }).join('');
  return `<div class="explore-day"><div class="d-title">${d.label}${d.subtitle?' — '+d.subtitle:''}</div>${rows}</div>`;
}

function renderProgramSection(){
  const ids = Object.keys(PROGRAMS);
  const options = ids.map(id=>`<option value="${id}" ${id===state.activeProgramId?'selected':''}>${PROGRAMS[id].label}</option>`).join('');
  const program = getActiveProgram();
  const explorePanel = state.exploreOpen
    ? `<div class="explore-panel">${program.days.map(d=>renderExploreDay(d)).join('')}</div>`
    : '';
  return `<div class="program-section">
    <div class="sect-label">PROGRAMA ACTIVO</div>
    <div class="program-row">
      <select onchange="switchProgram(this.value)">${options}</select>
      <label class="upload-label">Subir .json<input type="file" accept="application/json" onchange="handleProgramUpload(this)"/></label>
    </div>
    ${state.programUploadError?`<div class="error-text">${state.programUploadError}</div>`:''}

  </div>`;
}

function renderHome(){
  const storageNote = !IS_PERSISTENT ? `<div class="storage-note">Sin guardado permanente en este entorno: los datos duran mientras esta pestaña siga abierta.</div>` : '';

function renderSession(){
  const s = state.activeSession;
  if(!s) return `<div class="screen"><div class="empty-state">No hay sesión activa. Vuelve a Inicio para comenzar.</div></div>`;
  if(state.sessionSubview==='rest') return renderRest();
  if(state.sessionSubview==='complete') return renderComplete();
  if(state.sessionSubview==='summary') return renderSummary();
  return renderExec();
}

function renderExec(){
  const s = state.activeSession;
  const step = currentStep();
  const ex = exByIdInSession(s, step.exerciseId);
  const exIndex = s.exercisesSnapshot.findIndex(e=>e.id===ex.id);
  const cargaUnit = ex.unit || 'kg';
  const cargaStep = ex.carga>0 && ex.carga<10 ? 0.5 : (ex.carga>=10?1.25:1);
  const targetSeconds = parseTargetSeconds(ex.repsTarget);
  const isNewExercise = step.setIndex===1;

  const adjustBlock = state.adjustOpen ? `
    <div class="adjust-panel">
      <div class="field-block">
        <div class="field-label">Carga (${cargaUnit})</div>
        <div class="stepper">
          <button onclick="adjustDraft('carga',-${cargaStep})">−</button>
          <span class="val">${state.draft.carga}</span>
          <button onclick="adjustDraft('carga',${cargaStep})">+</button>
        </div>
      </div>
      <div class="field-block">
        <div class="field-label">Reps</div>
        <div class="stepper">
          <button onclick="adjustDraft('reps',-1)">−</button>
          <span class="val">${state.draft.reps}</span>
          <button onclick="adjustDraft('reps',1)">+</button>
        </div>
      </div>
    </div>` : '';

  let mainBlock = '';
  if(state.setPhase==='ready'){
    mainBlock = `
      <button class="start-btn confirm-btn" onclick="beginSet()">
        <div class="sb-label">Iniciar serie ${step.setIndex} de ${step.totalSets} ▶</div>
      </button>`;
  } else if(state.setPhase==='switch'){
    mainBlock = `
      <div class="active-hero switch-hero">
        <div class="h-label">CAMBIA DE LADO</div>
        <div class="h-count">✓ 1</div>
        <div class="h-detail">Lado 1 listo. Reacomódate para el lado 2.</div>
      </div>
      <button class="start-btn confirm-btn" onclick="continueToOtherSide()">
        <div class="sb-label">Listo, continuar ▶</div>
      </button>`;
  } else if(state.setPhase==='transition'){
    const nextStep = s.steps[s.currentStepIndex+1];
    const nextEx = nextStep ? exByIdInSession(s, nextStep.exerciseId) : null;
    mainBlock = `
      <div class="active-hero transition-hero">
        <div class="h-label">SIGUE SIN DESCANSO</div>
        <div class="h-detail" style="font-size:22px; margin-top:6px;">${nextEx? nextEx.name : ''}</div>
      </div>
      <button class="start-btn confirm-btn" onclick="continueTransition()">
        <div class="sb-label">Continuar ▶</div>
      </button>`;
  } else if(state.setPhase==='active'){
    const targetReps = state.draft.reps || ex.repsNum;
    const sideLabel = state.sideIndex ? `LADO ${state.sideIndex}` : null;
    let heroInner;
    if(targetSeconds!==null){
      heroInner = `<div class="h-count">${fmtTime(state.setElapsed)}</div><div class="h-detail">Objetivo: ${targetSeconds}s</div>`;
    } else {
      const outOfRange = (ex.tempoMin!==undefined && state.currentTempo<ex.tempoMin) || (ex.tempoMax!==undefined && state.currentTempo>ex.tempoMax);
      let rangeLine = '';
      if(ex.tempoMin!==undefined && ex.tempoMax!==undefined){
        rangeLine = outOfRange
          ? `<div class="tempo-warn">⚠ Fuera del rango recomendado (${ex.tempoMin}–${ex.tempoMax}s)</div>`
          : `<div class="tempo-ok">Rango recomendado: ${ex.tempoMin}–${ex.tempoMax}s</div>`;
      }
      heroInner = `
        <div class="beat-ring"></div>
        <div class="h-count">${Math.min(state.repCount+1,targetReps)} / ${targetReps}</div>
        <div class="h-detail">${sideLabel ? sideLabel+' · Repetición' : 'Repetición'}</div>
        <div class="tempo-row">
          <button onclick="adjustTempo(-0.5)">−</button>
          <span class="tempo-val">${state.currentTempo}s / rep</span>
          <button onclick="adjustTempo(0.5)">+</button>
        </div>
        ${rangeLine}`;
    }
    mainBlock = `
      <div class="active-hero ${state.setPaused?'paused':''}">
        <div class="h-label">${state.setPaused? 'PAUSADO' : 'SERIE '+step.setIndex+' DE '+step.totalSets+(sideLabel?' · '+sideLabel:'')+' EN CURSO'}</div>
        ${heroInner}
        <div class="h-weight">${ex.equipment? ex.equipment+' · ':''}${ex.carga>0? ex.carga+' '+cargaUnit : (ex.unit||'Peso corporal')}</div>
      </div>
      <div class="active-controls">
        <button class="finish-early" onclick="markSetDone()">Terminar ahora</button>
      </div>`;
  } else {
    mainBlock = `
      <div class="set-count">Serie ${step.setIndex} de ${step.totalSets} · lista</div>
      <p class="rpe-title">¿Cómo se sintió la serie?</p>
      <div class="rpe-grid">
        ${RPE_OPTIONS.map(o=>`<button class="rpe-card" onclick="chooseRpe(${o.v})">${o.label}</button>`).join('')}
      </div>`;
  }

  const canPause = state.setPhase==='active';
  const navStrip = `<div class="nav-strip">
      <button onclick="stepBack()" ${s.currentStepIndex<=0?'disabled':''}>⏮</button>
      <button onclick="toggleSetPause()" ${canPause?'':'disabled'}>${state.setPaused?'▶':'⏸'}</button>
      <button onclick="stepForward()" ${s.currentStepIndex>=s.steps.length-1?'disabled':''}>⏭</button>
    </div>`;

  return `<div class="topbar">
      <h1>${s.dayLabel}</h1>
      <div style="display:flex; gap:6px; align-items:center;">${soundToggleButton()}<button class="summary-link" onclick="viewSummary()">📋 Resumen</button></div>
    </div>
  <div class="screen">
    ${renderProgressScale(s)}
    ${navStrip}

    ${isNewExercise ? `<div class="new-exercise-flag">NUEVO EJERCICIO</div>` : ''}
    <div class="block-tag ${blockTagClass(ex.block)}">${blockLabel(ex.block)}</div>
    <h2 class="exercise-name">${ex.name}</h2>

    ${isNewExercise && step.pairedWith ? `<div class="pair-flag"><span class="pf-arrow">⚡</span><span class="pf-text">Es superserie: al terminar esta serie, <b>sigue directo con ${step.pairedWith}</b>, sin descanso.</span></div>` : ''}

    ${mainBlock}

    ${ex.sub? `<span class="exercise-tag">${ex.sub}</span>` : ''}
    ${ex.description? `<p class="exercise-description">${ex.description}</p>` : ''}
    <div class="equip-chip">🏋 ${ex.equipment? ex.equipment+' · ':''}${ex.carga>0? ex.carga+' '+cargaUnit : (ex.unit||'Peso corporal')}${ex.discConfig? ` <span class="config">(${ex.discConfig})</span>`:''}</div>
    <a class="video-link" href="${ex.videoUrl || 'https://www.google.com/search?q=' + encodeURIComponent('site:musclewiki.com '+ex.name)}" target="_blank" rel="noopener">▶ Ver técnica en video${ex.videoUrl? '' : ' (buscar)'}</a>
    ${ex.note ? `<p class="exercise-note-inline">${ex.note}</p>` : ''}
    ${isPerSide(ex.repsTarget)? `<p class="side-note">↔ Un lado y luego el otro cuentan como UNA serie</p>` : ''}

    ${state.setPhase==='ready' ? `<div>
      <button class="adjust-toggle" onclick="toggleAdjust()">${state.adjustOpen?'Ocultar ajuste':'Ajustar carga o reps'}</button>
    </div>
    ${adjustBlock}` : ''}
  </div>`;
}
/* Always-visible, larger progress scale shared by exec/rest/summary screens. */
function renderProgressScale(s){
  const pct = Math.round((s.currentStepIndex/s.steps.length)*100);
  const exIndex = s.currentStepIndex<s.steps.length
    ? s.exercisesSnapshot.findIndex(e=>e.id===s.steps[s.currentStepIndex].exerciseId)
    : s.exercisesSnapshot.length-1;
  const currentExId = s.currentStepIndex<s.steps.length ? s.steps[s.currentStepIndex].exerciseId : null;
  const segments = s.exercisesSnapshot.map(ex=>{
    const exSteps = s.steps.filter(st=>st.exerciseId===ex.id);
    const doneCount = exSteps.filter(st=>s.logs[st.exerciseId+'-'+st.setIndex]).length;
    const isDone = exSteps.length>0 && doneCount>=exSteps.length;
    const isCurrent = ex.id===currentExId;
    const stateCls = isCurrent ? 'current' : (isDone ? 'done' : 'pending');
    return `<button class="scale-seg ${blockTagClass(ex.block)} ${stateCls}" onclick="jumpToExercise('${ex.id}')" title="${ex.name}"></button>`;
  }).join('');
  return `<div class="progress-scale">
    <div class="progress-scale-label">Ejercicio ${exIndex+1} de ${s.exercisesSnapshot.length} · ${pct}%</div>
    <div class="scale-track">${segments}</div>
  </div>`;
}

function renderRest(){
  const s = state.activeSession;
  const prevStep = s.steps[s.currentStepIndex];
  const warnState = state.restRemaining<=5;
  const nextStep = s.steps[s.currentStepIndex+1];
  const nextEx = nextStep ? exByIdInSession(s, nextStep.exerciseId) : null;
  const nextCargaUnit = nextEx ? (nextEx.unit || 'kg') : '';
  const nextIsNewExercise = nextStep && nextStep.setIndex===1;
  return `<div class="topbar"><h1>${s.dayLabel}</h1><div style="display:flex; gap:6px; align-items:center;">${soundToggleButton()}<button class="summary-link" onclick="viewSummary()">📋 Resumen</button></div></div>
  <div class="screen">
    ${renderProgressScale(s)}
    <div class="nav-strip">
      <button onclick="stepBack()" ${s.currentStepIndex<=0?'disabled':''}>⏮</button>
      <button onclick="toggleRestPause()">${state.restPaused?'▶':'⏸'}</button>
      <button onclick="stepForward()" ${s.currentStepIndex>=s.steps.length-1?'disabled':''}>⏭</button>
    </div>
    <div class="rest-hero ${state.restPaused?'paused':''}">
      <div class="h-label">${state.restPaused?'DESCANSO · PAUSADO':'DESCANSO · '+prevStep.restLabel}</div>
      <div class="h-timer ${warnState?'warn':''}">${fmtTime(state.restRemaining)}</div>
    </div>
    <div class="rest-actions">
      <button class="btn secondary small" onclick="adjustRest(-15)">−15s</button>
      <button class="btn secondary small" onclick="adjustRest(15)">+15s</button>
    </div>
    <button class="finish-early" onclick="skipRest()">Continuar ahora</button>

    ${nextEx ? `<div class="next-up">
      <div class="next-up-label">${nextIsNewExercise?'SIGUE — NUEVO EJERCICIO':'SIGUE'}</div>
      <div class="next-up-name">${nextEx.name}</div>
      ${nextEx.sub? `<div class="next-up-sub">${nextEx.sub}</div>`:''}
      <div class="next-up-target">Serie ${nextStep.setIndex} de ${nextStep.totalSets} · ${nextEx.repsTarget}${nextEx.carga>0?' · '+nextEx.carga+' '+nextCargaUnit:(nextEx.unit?' · '+nextEx.unit:'')}${nextEx.equipment?' · '+nextEx.equipment:''}</div>
    </div>` : `<div class="next-up"><div class="next-up-label">ÚLTIMA SERIE</div><div class="next-up-name">Esta es la última serie de la sesión</div></div>`}
  </div>`;
}

function viewSummary(){ state.sessionSubview='summary'; render(); }
function backToExec(){ state.sessionSubview = state.activeSession.currentStepIndex>=state.activeSession.steps.length ? 'complete':'exec'; render(); }

function renderSummary(){
  const s = state.activeSession;
  const ex = s.exercisesSnapshot;
  const remaining = estimateRemainingSeconds();
  const {avgRpe, totalVolume} = sessionAggregates();
  const pairNumbers = {};
  const pairColors = ['#6D5FA8','#4C8C6B','#B5652E','#3E6FA5','#A0527A'];
  let pairCounter = 0;
  ex.forEach(e=>{
    if(e.pair && !(e.pair in pairNumbers)){ pairNumbers[e.pair] = pairCounter; pairCounter++; }
  });
  const rows = ex.map(e=>{
    const doneSets = s.steps.filter(st=>st.exerciseId===e.id).map((st)=> s.logs[e.id+'-'+st.setIndex]).filter(Boolean).length;
    const totalSets = e.series;
    const isCurrent = currentStep() && currentStep().exerciseId===e.id;
    const isDone = doneSets>=totalSets;
    let statusTxt, statusCls;
    if(isDone){ statusTxt='Hecho ✓'; statusCls='done'; }
    else if(isCurrent || doneSets>0){ statusTxt=`Serie ${doneSets} de ${totalSets}`; statusCls='current'; }
    else { statusTxt=`Serie ${doneSets} de ${totalSets}`; statusCls=''; }
    const rowStateCls = isDone ? 'done' : (isCurrent ? 'current' : '');
    const pairColor = e.pair ? pairColors[pairNumbers[e.pair] % pairColors.length] : null;
    const pairTag = e.pair ? `<span class="superserie-tag" style="color:${pairColor};border-color:${pairColor};">⚡ Superserie ${pairNumbers[e.pair]+1}</span>` : '';
    return `<button class="ex-row nav ${rowStateCls}" onclick="jumpToExercise('${e.id}')">
      <span class="ex-row-main">
        <span class="block-dot ${blockTagClass(e.block)}"></span>
        <span class="name ${isCurrent?'current':''}">${e.name}</span>
        ${pairTag}
      </span>
      <span class="ex-row-sub">${e.repsTarget}${e.carga>0?' · '+e.carga+(e.unit?' '+e.unit:''):''}</span>
      <span class="status ${statusCls}">${statusTxt}</span>
    </button>`;
  }).join('');
  return `<div class="topbar"><h1>${s.dayLabel} · Resumen</h1><button class="btn ghost" onclick="backToExec()">Volver</button></div>
  <div class="screen">
    ${renderProgressScale(s)}
    <div class="time-remaining">
      <div class="num">${fmtTime(remaining)}</div>
      <div class="lbl">tiempo estimado restante</div>
    </div>
    <div class="stat-grid">
      <div class="stat-box"><div class="num">${totalVolume.toLocaleString('es-CL')}</div><div class="lbl">kg movidos hasta ahora</div></div>
      <div class="stat-box"><div class="num">${avgRpe?avgRpe.toFixed(1):'—'}</div><div class="lbl">RPE promedio</div></div>
    </div>
    <p class="nav-hint">Toca cualquier ejercicio para ir directo a él.</p>
    ${rows}
  </div>`;
}
function jumpToExercise(exerciseId){
  const s = state.activeSession;
  if(state.setTimerHandle){ clearInterval(state.setTimerHandle); state.setTimerHandle=null; }
  if(state.restTimerHandle){ clearInterval(state.restTimerHandle); state.restTimerHandle=null; }
  const exSteps = s.steps.map((st,i)=>({st,i})).filter(o=>o.st.exerciseId===exerciseId);
  if(exSteps.length===0) return;
  let target = exSteps.find(o=> !s.logs[exerciseId+'-'+o.st.setIndex]);
  if(!target) target = exSteps[0];
  s.currentStepIndex = target.i;
  state.sessionSubview='exec';
  loadDraftForCurrentStep();
  persistActiveSession();
  render();
}

function renderComplete(){
  const s = state.activeSession;
  const {avgRpe, totalVolume} = sessionAggregates();
  const durationMin = Math.round((Date.now()-s.startTime)/60000);
  return `<div class="topbar"><h1>${s.dayLabel} · Completada</h1></div>
  <div class="screen">
    <div class="hero"><p class="eyebrow">Sesión terminada</p><h2>Buen trabajo.</h2></div>
    <div class="stat-grid">
      <div class="stat-box"><div class="num">${totalVolume.toLocaleString('es-CL')}</div><div class="lbl">kg totales</div></div>
      <div class="stat-box"><div class="num">${avgRpe?avgRpe.toFixed(1):'—'}</div><div class="lbl">RPE promedio</div></div>
      <div class="stat-box"><div class="num">${durationMin}</div><div class="lbl">minutos</div></div>
      <div class="stat-box"><div class="num">${s.steps.length}</div><div class="lbl">series totales</div></div>
    </div>
    <div class="field-label" style="margin-bottom:6px;">Notas de la sesión (opcional)</div>

function renderProgress(){
  const h = state.history;
  if(h.length===0){
    return `<div class="topbar"><h1>PROGRESO</h1></div>
    <div class="screen">
      ${renderCalendar()}
      <div class="empty-state">Aún no hay sesiones registradas.<br/>Completa tu primera sesión para ver el progreso aquí.</div>
    </div>`;
  }
  const completedHistory = h.filter(r=>r.status!=='incomplete');
  const volPoints = completedHistory.map(r=>({x:fmtDate(r.date), y:r.totalVolume}));
  const rpePoints = completedHistory.map(r=>({x:fmtDate(r.date), y:r.avgRpe||0}));
  const pullupPoints = completedHistory.map(r=>{
    const keyLogs = Object.values(r.logs).filter(l=>l.keyMetric);
    const maxReps = keyLogs.length ? Math.max(...keyLogs.map(l=>l.reps||0)) : null;
    return maxReps!==null ? {x:fmtDate(r.date), y:maxReps} : null;
  }).filter(Boolean);

  const nameHasLoad = new Map();
  completedHistory.forEach(r=> Object.values(r.logs).forEach(l=>{
    if(!l.name) return;
    if(!nameHasLoad.has(l.name)) nameHasLoad.set(l.name, (l.carga||0)>0);
    else if((l.carga||0)>0) nameHasLoad.set(l.name, true);
  }));
  const allExNames = [...nameHasLoad.entries()].filter(([,hasLoad])=>hasLoad).map(([name])=>name);
  const selectedName = state.selectedProgressExName && allExNames.includes(state.selectedProgressExName) ? state.selectedProgressExName : allExNames[0];
  const loadPoints = selectedName ? completedHistory.map(r=>{
    const setLogs = Object.values(r.logs).filter(l=>l.name===selectedName);
    const maxCarga = setLogs.length ? Math.max(...setLogs.map(l=>l.carga||0)) : null;
    return maxCarga!==null ? {x:fmtDate(r.date), y:maxCarga} : null;
  }).filter(Boolean) : [];

  return `<div class="topbar"><h1>PROGRESO</h1></div>
  <div class="screen">
    ${renderCalendar()}
    <div class="stat-grid">
      <div class="stat-box"><div class="num">${h.length}</div><div class="lbl">sesiones registradas</div></div>
      <div class="stat-box"><div class="num">${fmtDate(h[h.length-1].date)}</div><div class="lbl">última sesión</div></div>
    </div>

    <div class="chart-block">
      <div class="chart-title">Volumen total por sesión</div>
      <div class="chart-sub">kg × series × reps</div>
      ${barChart(volPoints,{color:'#3E7C74'})}
    </div>

    <div class="chart-block">
      <div class="chart-title">RPE promedio por sesión</div>
      <div class="chart-sub">objetivo: mantenerse entre 7 y 8</div>
      ${lineChart(rpePoints,{color:'#D9A441'})}
    </div>

    <div class="chart-block">
      <div class="chart-title">Métrica clave — reps por sesión</div>
      <div class="chart-sub">el ejercicio marcado como métrica clave en el programa activo (ej. dominadas)</div>
      ${lineChart(pullupPoints,{color:'#BF4427'})}
    </div>

    ${allExNames.length ? `<div class="chart-block">
      <div class="chart-title">Progresión de carga por ejercicio</div>
      <select onchange="state.selectedProgressExName=this.value; render();">
        ${allExNames.map(n=>`<option value="${n}" ${n===selectedName?'selected':''}>${n}</option>`).join('')}
      </select>
      ${lineChart(loadPoints,{color:'#3E7C74', yFmt:v=>v+'kg'})}
    </div>` : ''}
  </div>`;
}

  return `<div class="export-section">
    <div class="sect-label">IMPORTAR HISTORIAL</div>
    <p class="export-help">Si vienes de otra dirección web (por ejemplo, migraste de Netlify a GitHub Pages), sube aquí el archivo que exportaste antes para seguir donde quedaste.</p>
    <label class="upload-label">Subir .json<input type="file" accept="application/json" onchange="handleHistoryImport(this)"/></label>
