        <button class="btn secondary small" onclick="copyHistoryToClipboard()">Copiar</button>
      </div>
      ${state.exportCopied==='ok' ? `<div class="export-status ok">Copiado al portapapeles.</div>` : ''}
      ${state.exportCopied==='error' ? `<div class="export-status error">No se pudo copiar. Prueba con "Descargar .json".</div>` : ''}
    </div>
    ${renderScheduleSection()}
    ${renderImportSection()}
  </div>`;
}
function renderScheduleSection(){
  const cfg = state.scheduleConfig;
  const program = getActiveProgram();
  return `<div class="program-section">
    <div class="sect-label">DISTRIBUCIÓN DE SESIONES</div>
    <label class="radio-row"><input type="radio" name="schedmode" value="weekday" ${cfg.mode==='weekday'?'checked':''} onchange="setScheduleMode('weekday')"> Días fijos de la semana</label>
    ${cfg.mode==='weekday' ? `<div class="schedule-sub">
      <span>Empezar en:</span>
      <select onchange="setStartWeekday(this.value)">
        ${WEEKDAY_NAMES.map((d,i)=>`<option value="${i+1}" ${cfg.startWeekday===i+1?'selected':''}>${d}</option>`).join('')}
      </select>
    </div>` : ''}
    <label class="radio-row"><input type="radio" name="schedmode" value="interval" ${cfg.mode==='interval'?'checked':''} onchange="setScheduleMode('interval')"> Cada N días</label>
    ${cfg.mode==='interval' ? `<div class="schedule-sub">
      <span>Cada</span>
      <input type="number" min="1" max="14" value="${cfg.intervalDays}" style="width:56px;" onchange="setIntervalDays(this.value)">
      <span>días, continuando desde tu última sesión registrada</span>
    </div>` : ''}
    <label class="radio-row"><input type="radio" name="schedmode" value="program" ${cfg.mode==='program'?'checked':''} onchange="setScheduleMode('program')"> Seguir recomendación del programa</label>
    ${cfg.mode==='program' ? `<div class="schedule-sub">${renderProgramRecommendationInfo(program)}</div>` : ''}
  </div>`;
}
function renderProgramRecommendationInfo(program){
  const rec = program.schedule;
  if(!rec) return `Este programa no trae una recomendación propia; se usará "Días fijos" desde el lunes por defecto.`;
  if(rec.recommendedMode==='interval') return `El programa recomienda entrenar cada ${rec.recommendedIntervalDays} días.`;
  if(rec.recommendedMode==='weekdays') return `El programa recomienda: ${rec.recommendedWeekdays.map(w=>WEEKDAY_NAMES[w-1]).join(', ')}.`;
  return '';
}
function handleHistoryImport(input){
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try{
      const data = JSON.parse(e.target.result);
      const incoming = Array.isArray(data.history) ? data.history : (Array.isArray(data) ? data : null);
      if(!incoming){
        state.importError = 'El archivo no tiene el formato esperado (debe incluir un arreglo "history", como el que genera "Descargar .json").';
        state.importMessage = null;
        render(); return;
      }
      const existingIds = new Set(state.history.map(r=>r.id));
      let added = 0;
      incoming.forEach(rec=>{
        if(rec && rec.id && !existingIds.has(rec.id)){
          state.history.push(rec); existingIds.add(rec.id); added++;
        }
      });
      state.history.sort((a,b)=> new Date(a.date) - new Date(b.date));
      storeSet('master46_history', state.history);
      state.importError = null;
      state.importMessage = added>0 ? `Se importaron ${added} sesión(es) nueva(s).` : 'Ese historial ya estaba incorporado, no había sesiones nuevas.';
      render();
    }catch(err){
      state.importMessage = null;
      state.importError = 'No se pudo leer el archivo: no es un JSON válido.';
      render();
    }
  };
  reader.readAsText(file);
  input.value = '';
}
function exportHistoryPayload(){
  return JSON.stringify({
    exportedAt: new Date().toISOString(),
    activeProgramId: state.activeProgramId,
    activeProgramLabel: getActiveProgram().label,
    history: state.history
  }, null, 2);
}
function downloadHistory(){
  const data = exportHistoryPayload();
  const blob = new Blob([data], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'master46-historial.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
async function copyHistoryToClipboard(){
  const data = exportHistoryPayload();
  try{
    await navigator.clipboard.writeText(data);
    state.exportCopied = 'ok';
  }catch(e){
    state.exportCopied = 'error';
  }
  render();
  setTimeout(()=>{ state.exportCopied=null; render(); }, 3000);
}
